<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sources · Corrosion Atlas Curator</title>

  <link rel="stylesheet" href="/assets/curator.css">
</head>

<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-title">Corrosion Atlas</div>
      <div class="brand-subtitle">Curator</div>
    </div>
  </header>

  <main class="page">
    <div class="page-heading">
      <div>
        <h1>Sources</h1>
        <p class="page-description">
          Browse and search source records in the Corrosion Atlas database.
        </p>
      </div>

      <div class="page-actions">
        <div id="source-count" class="source-count"></div>

        <a
          class="button button-primary"
          href="/sources/detail/?new=1"
        >
          + New source
        </a>
      </div>
    </div>

    <section class="source-pdf-download-panel">
      <div class="source-pdf-download-heading">
        <div>
          <strong>PDF downloads</strong>
          <div
            id="pdf-download-count"
            class="source-count"
          ></div>
        </div>

        <div class="page-actions">
          <button
            id="pdf-select-all"
            class="button"
            type="button"
          >
            Select all
          </button>

          <button
            id="pdf-clear-all"
            class="button"
            type="button"
          >
            Clear
          </button>

          <button
            id="pdf-download-selected"
            class="button"
            type="button"
            disabled
          >
            Download selected
          </button>

          <button
            id="pdf-download-all"
            class="button button-primary"
            type="button"
          >
            Download all PDFs
          </button>
        </div>
      </div>

      <div
        id="pdf-download-options"
        class="source-pdf-download-options"
      ></div>
    </section>



<details class="programme-manager">
  <summary>
    Research programmes
    <span class="programme-summary-hint">
      Manage abbreviations and full names
    </span>
  </summary>

  <section class="related-section programme-manager-body">


  <div id="programme-list"></div>

  <form id="programme-form"
        style="display:grid;gap:12px;max-width:720px;margin-top:18px;">

    <input id="programme-id" type="hidden">

    <label>
      Display name / abbreviation
      <input id="programme-display"
             class="detail-input"
             placeholder="e.g. ACCRP–NRC"
             required>
    </label>

    <label>
      Full programme name
      <input id="programme-full"
             class="detail-input"
             placeholder="Official full name">
    </label>

    <label>
      Description / historical notes
      <textarea id="programme-description"
                class="detail-input"
                rows="3"></textarea>
    </label>

    <div class="page-actions">
      <button type="submit"
              class="button button-primary">
        Save programme
      </button>

      <button id="programme-clear"
              type="button"
              class="button">
        Clear
      </button>
    </div>

    <div id="programme-status"
         class="save-message"
         hidden></div>
  </form>
  </section>
</details>


    <div class="search-panel">
      <input
        id="source-search"
        class="search-input"
        type="search"
        placeholder="Search code, title, author, year, or type…"
        autocomplete="off"
      >
    </div>

    <div id="status" class="status">
      Loading sources…
    </div>

    <div id="source-list" class="source-list" hidden></div>
  </main>

  <script src="/assets/curator-nav.js"></script>
  <script src="/assets/multi-value.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="/assets/sources.js"></script>
  <script src="/assets/programmes.js"></script>
</body>
</html>
