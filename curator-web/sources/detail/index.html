<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Source · Corrosion Atlas Curator</title>

  <link rel="stylesheet" href="/assets/curator.css">
</head>

<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-title">Corrosion Atlas</div>
      <div class="brand-subtitle">Curator</div>
    </div>
  </header>

  <main class="page">
    <a class="back-link" href="/sources/">← Sources</a>

    <div id="status" class="status">
      Loading source…
    </div>

    <div id="source-detail" hidden>
      <div class="detail-heading">
        <div>
          <div id="source-code" class="detail-code"></div>
          <h1 id="source-title"></h1>
        </div>

        <div class="detail-actions">
          <button id="edit-button" class="button" type="button">
            Edit
          </button>

          <button
            id="cancel-button"
            class="button button-secondary"
            type="button"
            hidden
          >
            Cancel
          </button>

          <button
            id="save-button"
            class="button button-primary"
            type="button"
            hidden
          >
            Save
          </button>
        </div>
      </div>

      <div id="save-message" class="save-message" hidden></div>

      <div id="source-fields" class="detail-fields"></div>

      <section
        id="source-pdf-section"
        class="related-section"
        hidden
      >
        <div class="related-heading">
          <div>
            <h2>Private PDF</h2>

            <p class="related-description">
              Source document stored privately in Cloudflare R2.
            </p>
          </div>
        </div>

        <div class="source-pdf-card">

          <div class="source-pdf-main">
            <div
              id="source-pdf-title"
              class="source-pdf-title"
            >
              No PDF attached
            </div>

            <div
              id="source-pdf-meta"
              class="source-pdf-meta"
            >
              Upload a PDF for this Source.
            </div>
          </div>

          <div class="source-pdf-actions">

            <a
              id="open-source-pdf"
              class="button"
              target="_blank"
              rel="noopener"
              hidden
            >
              Open PDF
            </a>

            <button
              id="upload-source-pdf"
              class="button"
              type="button"
            >
              Upload PDF
            </button>

            <button
              id="remove-source-pdf"
              class="button button-danger"
              type="button"
              hidden
            >
              Remove PDF
            </button>

          </div>

        </div>

        <input
          id="source-pdf-input"
          type="file"
          accept=".pdf,application/pdf"
          hidden
        >

        <div
          id="source-pdf-message"
          class="save-message"
          hidden
        ></div>

      </section>

      <section id="site-links-section" class="related-section">

        <div class="related-heading">
          <div>
            <h2>Linked sites</h2>
            <p class="related-description">
              Exposure sites associated with this source.
            </p>
          </div>

          <button
            id="add-site-link-button"
            class="button"
            type="button"
          >
            + Add site
          </button>
        </div>

        <div id="site-link-form" class="link-form" hidden>

          <div class="link-form-field">
            <label for="link-site">Site</label>
            <select id="link-site" class="detail-input"></select>
          </div>

          <div class="link-form-field">
            <label for="site-link-order">Source order</label>
            <input
              id="site-link-order"
              class="detail-input"
              type="number"
              min="1"
              step="1"
              value="1"
            >
          </div>

          <div class="link-form-field">
            <label for="site-link-metals">Metals</label>
            <input
              id="site-link-metals"
              class="detail-input"
              type="text"
            >
          </div>

          <div class="link-form-field">
            <label for="site-link-exposure-periods">
              Exposure periods
            </label>
            <input
              id="site-link-exposure-periods"
              class="detail-input"
              type="text"
            >
          </div>

          <div class="link-form-field link-form-field-wide">
            <label for="site-link-notes">Notes</label>
            <textarea
              id="site-link-notes"
              class="detail-input"
              rows="3"
            ></textarea>
          </div>

          <div class="link-form-actions">
            <button
              id="cancel-site-link-button"
              class="button button-secondary"
              type="button"
            >
              Cancel
            </button>

            <button
              id="save-site-link-button"
              class="button button-primary"
              type="button"
            >
              Save link
            </button>
          </div>
        </div>

        <div
          id="site-link-message"
          class="save-message"
          hidden
        ></div>

        <div id="linked-sites-status" class="status">
          Loading linked sites…
        </div>

        <div id="linked-sites" class="linked-sources" hidden></div>

      </section>
    </div>
  </main>

  <script src="/assets/curator-nav.js"></script>
  <script src="/assets/source-detail.js"></script>
</body>
</html>
