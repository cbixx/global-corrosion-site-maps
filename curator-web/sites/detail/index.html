<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Site · Corrosion Atlas Curator</title>

  <link rel="stylesheet" href="/assets/curator.css">
</head>

<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-title">Corrosion Atlas</div>
      <div class="brand-subtitle">Curator</div>
    </div>
  </header>

  <main class="page">
    <a class="back-link" href="/sites/">← Sites</a>

    <div id="status" class="status">Loading site…</div>

    <div id="site-detail" hidden>
      <div class="detail-heading">
        <div>
          <div id="site-code" class="detail-code"></div>
          <h1 id="site-title"></h1>
        </div>

        <div class="detail-actions">
          <button id="edit-button" class="button" type="button">Edit</button>
          <button id="cancel-button" class="button button-secondary" type="button" hidden>
            Cancel
          </button>
          <button id="save-button" class="button button-primary" type="button" hidden>
            Save
          </button>
        </div>
      </div>

      <div id="save-message" class="save-message" hidden></div>
      <section
        id="site-create-tools"
        class="site-create-tools"
        hidden
      >
        <div class="site-create-tool">
          <h2>Location lookup</h2>

          <p class="related-description">
            Search OpenStreetMap, then apply a result to fill the
            site name, coordinates, and country.
          </p>

          <div class="location-search-row">
            <input
              id="location-query"
              class="detail-input"
              type="search"
              placeholder="e.g. Yakutsk, Russia"
              autocomplete="off"
            >

            <button
              id="location-search-button"
              class="button"
              type="button"
            >
              Search
            </button>

            <button
              id="location-clear-button"
              class="button button-secondary"
              type="button"
            >
              Clear
            </button>
          </div>

          <div
            id="location-search-status"
            class="helper-message"
            hidden
          ></div>

          <div
            id="location-results"
            class="location-results"
            hidden
          ></div>
        </div>

        <div
          id="site-id-suggestion"
          class="helper-message"
        >
          Enter a modern country / location to generate a Site ID.
        </div>

        <div
          id="site-match-preview"
          class="save-message"
          hidden
        ></div>
      </section>
      <div id="site-fields" class="detail-fields"></div>

      <section id="source-links-section" class="related-section">

        <div class="related-heading">
            <div>
            <h2>Linked sources</h2>
            <p class="related-description">
                Sources associated with this exposure site.
            </p>
            </div>

            <button
            id="add-source-link-button"
            class="button"
            type="button"
            >
            + Add source
            </button>
        </div>

        <div id="link-form" class="link-form" hidden>

            <div class="link-form-field">
            <label for="link-source">Source</label>
            <select id="link-source" class="detail-input"></select>
            </div>

            <div class="link-form-field">
            <label for="link-order">Source order</label>
            <input
                id="link-order"
                class="detail-input"
                type="number"
                min="1"
                step="1"
                value="1"
            >
            </div>

            <div class="link-form-field">
            <label for="link-metals">Metals</label>
            <input
                id="link-metals"
                class="detail-input"
                type="text"
            >
            </div>

            <div class="link-form-field">
            <label for="link-exposure-periods">
                Exposure periods
            </label>
            <input
                id="link-exposure-periods"
                class="detail-input"
                type="text"
            >
            </div>

            <div class="link-form-field link-form-field-wide">
            <label for="link-notes">Notes</label>
            <textarea
                id="link-notes"
                class="detail-input"
                rows="3"
            ></textarea>
            </div>

            <div class="link-form-actions">
            <button
                id="cancel-link-button"
                class="button button-secondary"
                type="button"
            >
                Cancel
            </button>

            <button
                id="save-link-button"
                class="button button-primary"
                type="button"
            >
                Save link
            </button>
            </div>

        </div>

        <div id="link-message" class="save-message" hidden></div>

        <div id="linked-sources-status" class="status">
            Loading linked sources…
        </div>

        <div id="linked-sources" class="linked-sources" hidden></div>

        </section>
    </div>
  </main>

  <script src="/assets/site-detail.js"></script>
</body>
</html>
