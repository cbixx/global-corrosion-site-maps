<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>研究工具 | Corrosion Atlas</title>
  <meta name="description" content="Corrosion Atlas 中文研究工具页面。">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://corrosionatlas.org/zh/tools/">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/assets/icons/favicon.ico?v=3" sizes="any">
  <link rel="icon" href="/assets/icons/favicon.svg?v=3" type="image/svg+xml">
  <meta name="theme-color" content="#10293A">
</head>

<body>
  <main class="content-page tools-page">
    <div class="landing-kicker">研究工具</div>

    <h1>腐蚀与修复材料研究工具</h1>

    <p>
      这里收录与腐蚀、耐久性、修复材料、结构仿真及研究数据整理相关的浏览器端工具。
    </p>

    <section class="tools-grid" aria-label="Available research tools">
      <a class="tool-card" href="/zh/tools/color-compatible-repair/">
        <h2>颜色相容性修复计算器</h2>
        <p>
          基于目标混凝土的 L*、a*、b* 颜色值，计算 MPC 修复砂浆的推荐颜料组合与掺量。
        </p>
        <span>打开工具 →</span>
      </a>

      <a class="tool-card" href="/zh/tools/lsdyna-deck/">
        <h2>LS-DYNA 关键字文件浏览与编辑器</h2>
        <p>
          在浏览器本地读取、整理和初步检查 LS-DYNA 的 .k、.key 与 .dyn 文件；
          可查看部件、材料、截面、初始速度、边界条件、接触、控制及输出设置，
          并导出编辑副本。
        </p>
        <span>打开工具 →</span>
      </a>

      <div class="tool-card tool-card-muted">
        <h2>更多中文工具建设中</h2>
        <p>
          后续将逐步加入随机表面生成器、腐蚀数据整理工具和其他研究辅助工具。
        </p>
      </div>
    </section>
  </main>

  <script src="/assets/site-i18n.js" defer></script>
  <script src="/assets/site-shell.js" defer></script>
</body>
</html>
